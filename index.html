<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<meta name="description" content="Arcane Chess 7x7 - scacchi tattici guidati da un mazzo di carte. Gioca contro il bot o sfida un amico con un codice partita.">
<title>Arcane Chess 7x7</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="mask-icon" href="favicon.svg" color="#4c9aff">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="bg-fx" aria-hidden="true"></div>

<!-- ============================ HOME ============================ -->
<section id="screen-home" class="screen active">
  <div class="home-wrap">
    <header class="brand">
      <div class="brand-mark"><img src="favicon.svg" alt="" width="76" height="76"></div>
      <h1 class="brand-name">ARCANE CHESS</h1>
      <p class="brand-sub" data-i18n="tagline"></p>
    </header>

    <div class="panel home-panel">
      <label class="field-label" for="nickname" data-i18n="home.nickLabel"></label>
      <div class="field">
        <i class="fas fa-user"></i>
        <input id="nickname" type="text" maxlength="14" autocomplete="off" spellcheck="false" data-i18n-ph="home.nickPh">
      </div>

      <div class="menu">
        <button id="btn-play-bot" class="btn btn-primary btn-menu">
          <i class="fas fa-robot"></i>
          <span class="btn-txt"><b data-i18n="home.playBot"></b><small data-i18n="home.playBotSub"></small></span>
          <i class="fas fa-chevron-right arrow"></i>
        </button>
        <button id="btn-create" class="btn btn-menu">
          <i class="fas fa-tower-broadcast"></i>
          <span class="btn-txt"><b data-i18n="home.create"></b><small data-i18n="home.createSub"></small></span>
          <i class="fas fa-chevron-right arrow"></i>
        </button>
        <button id="btn-join" class="btn btn-menu">
          <i class="fas fa-key"></i>
          <span class="btn-txt"><b data-i18n="home.join"></b><small data-i18n="home.joinSub"></small></span>
          <i class="fas fa-chevron-right arrow"></i>
        </button>
      </div>

      <div class="home-foot">
        <div class="foot-links">
          <button id="btn-rules" class="link-btn"><i class="fas fa-book-open"></i> <span data-i18n="home.rules"></span></button>
          <button id="btn-net" class="link-btn"><i class="fas fa-wifi"></i> <span data-i18n="net.settings"></span></button>
        </div>
        <div class="lang-selector">
          <button data-lang="it" class="lang-btn active">IT</button>
          <button data-lang="en" class="lang-btn">EN</button>
        </div>
      </div>
    </div>
    <p class="net-note" id="net-note"></p>
  </div>
</section>

<!-- ============================ LOBBY (host) ============================ -->
<section id="screen-lobby" class="screen">
  <div class="home-wrap narrow">
    <div class="panel">
      <h2 class="panel-title"><i class="fas fa-tower-broadcast"></i> <span data-i18n="lobby.title"></span></h2>
      <p class="panel-sub" data-i18n="lobby.sub"></p>

      <div class="code-box">
        <span id="game-code" class="code-value">-----</span>
        <button id="btn-copy" class="btn btn-icon" data-i18n-title="lobby.copy"><i class="fas fa-copy"></i></button>
      </div>

      <button id="btn-invite" class="btn btn-block"><i class="fas fa-link"></i> <span data-i18n="lobby.link"></span></button>

      <div class="status-line"><span class="spinner" id="lobby-spinner"></span><span id="lobby-status"></span></div>
      <button id="btn-lobby-net" class="link-btn center-link"><i class="fas fa-wifi"></i> <span data-i18n="net.settings"></span></button>
      <button id="btn-lobby-back" class="btn ghost btn-block"><i class="fas fa-arrow-left"></i> <span data-i18n="common.back"></span></button>
    </div>
  </div>
</section>

<!-- ============================ JOIN ============================ -->
<section id="screen-join" class="screen">
  <div class="home-wrap narrow">
    <div class="panel">
      <h2 class="panel-title"><i class="fas fa-key"></i> <span data-i18n="join.title"></span></h2>
      <p class="panel-sub" data-i18n="join.sub"></p>

      <div class="field code-field">
        <input id="join-code" type="text" maxlength="7" autocomplete="off" spellcheck="false" placeholder="ABC12">
      </div>

      <button id="btn-do-join" class="btn btn-primary btn-block"><i class="fas fa-right-to-bracket"></i> <span data-i18n="join.action"></span></button>
      <div class="status-line"><span id="join-status"></span></div>
      <button id="btn-join-net" class="btn btn-block" hidden><i class="fas fa-wifi"></i> <span data-i18n="net.settings"></span></button>
      <button id="btn-join-back" class="btn ghost btn-block"><i class="fas fa-arrow-left"></i> <span data-i18n="common.back"></span></button>
    </div>
  </div>
</section>

<!-- ============================ GAME ============================ -->
<section id="screen-game" class="screen">
  <div class="game-shell">

    <main class="board-column">
      <!-- Opponent -->
      <div class="player-bar" id="bar-opp">
        <div class="avatar" id="opp-avatar"><i class="fas fa-robot"></i></div>
        <div class="pb-main">
          <div class="pb-name-row">
            <span class="pb-name" id="opp-name">Bot</span>
            <span class="side-chip black" id="opp-side"></span>
          </div>
          <div class="pb-meta">
            <span class="pill" data-i18n-title="game.deck"><i class="fas fa-layer-group"></i><b id="opp-deck">0</b></span>
            <span class="pill" data-i18n-title="game.hand"><i class="fas fa-hand-sparkles"></i><b id="opp-hand">0</b></span>
            <span class="pb-status" id="opp-status"></span>
          </div>
        </div>
        <div class="thinking-dots" id="opp-thinking"><span></span><span></span><span></span></div>
      </div>

      <!-- Board -->
      <div class="board-frame">
        <div id="board" class="board"></div>
      </div>

      <!-- Me -->
      <div class="player-bar me" id="bar-me">
        <div class="avatar me" id="me-avatar"><i class="fas fa-user"></i></div>
        <div class="pb-main">
          <div class="pb-name-row">
            <span class="pb-name" id="me-name">Tu</span>
            <span class="side-chip white" id="me-side"></span>
          </div>
          <div class="pb-meta">
            <span class="pill" data-i18n-title="game.deck"><i class="fas fa-layer-group"></i><b id="me-deck">0</b></span>
            <span class="pill" data-i18n-title="game.discard"><i class="fas fa-trash-can"></i><b id="me-discard">0</b></span>
            <span class="pb-status" id="me-status"></span>
          </div>
        </div>
      </div>

      <!-- Turn strip -->
      <div class="turn-strip">
        <div class="ap-box" id="ap-box">
          <i class="fas fa-bolt ap-icon"></i>
          <div class="ap-txt">
            <span class="ap-label" data-i18n="game.actions"></span>
            <div class="ap-pips" id="ap-pips"></div>
          </div>
          <span class="ap-count"><b id="ap-now">1</b><span class="ap-sep">/</span><span id="ap-max">1</span></span>
        </div>
        <button id="end-turn-btn" class="btn btn-primary end-turn">
          <i class="fas fa-flag-checkered"></i> <span data-i18n="game.endTurn"></span>
        </button>
      </div>

      <!-- Hand -->
      <div class="hand-zone">
        <div class="zone-head">
          <h4><i class="fas fa-fan"></i> <span data-i18n="game.yourHand"></span></h4>
          <span class="hint" id="hand-hint"></span>
        </div>
        <div id="player-hand" class="hand"></div>
      </div>
    </main>

    <!-- Rail -->
    <aside class="rail">
      <div class="rail-head">
        <div class="brand-mini"><img src="favicon.svg" alt="" width="26" height="26"><span>Arcane Chess</span></div>
        <div class="rail-head-btns">
          <button id="btn-rules-2" class="btn btn-icon ghost" data-i18n-title="home.rules"><i class="fas fa-book-open"></i></button>
          <button id="btn-exit" class="btn btn-icon ghost" data-i18n-title="game.leave"><i class="fas fa-right-from-bracket"></i></button>
        </div>
      </div>

      <div class="turn-banner" id="turn-banner"><i class="fas fa-hourglass-half"></i> <span id="turn-banner-txt"></span></div>

      <div class="rail-section log-container">
        <h6><i class="fas fa-scroll"></i> <span data-i18n="game.log"></span></h6>
        <div id="log"></div>
      </div>

      <div class="room-tag" id="room-tag" hidden><i class="fas fa-hashtag"></i> <span id="room-code"></span></div>
    </aside>

  </div>
</section>

<!-- ============================ MODALS ============================ -->
<div class="modal-back" id="modal-result">
  <div class="modal result-modal">
    <div class="result-icon" id="result-icon"><i class="fas fa-crown"></i></div>
    <h2 id="result-title"></h2>
    <p id="result-sub"></p>
    <div class="modal-actions">
      <button id="btn-rematch" class="btn btn-primary btn-block"><i class="fas fa-rotate-right"></i> <span data-i18n="result.rematch"></span></button>
      <button id="btn-to-home" class="btn ghost btn-block"><i class="fas fa-house"></i> <span data-i18n="result.home"></span></button>
    </div>
  </div>
</div>

<div class="modal-back" id="modal-rules">
  <div class="modal rules-modal">
    <div class="modal-head">
      <h2><i class="fas fa-book-open"></i> <span data-i18n="rules.title"></span></h2>
      <button id="btn-rules-close" class="btn btn-icon ghost"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="rules-body"></div>
  </div>
</div>

<div id="toast-host" class="toast-host"></div>

<!-- ============================ MODAL RETE ============================ -->
<div class="modal-back" id="modal-net">
  <div class="modal net-modal">
    <div class="modal-head">
      <h2><i class="fas fa-wifi"></i> <span data-i18n="netcfg.title"></span></h2>
      <button id="btn-net-close" class="btn btn-icon ghost"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <p class="panel-sub" data-i18n="netcfg.sub"></p>

      <label class="field-label" for="turn-input" data-i18n="netcfg.turnLabel"></label>
      <textarea id="turn-input" class="net-input" rows="4" spellcheck="false" autocomplete="off" data-i18n-ph="netcfg.ph"></textarea>
      <p class="net-hint" data-i18n="netcfg.turnHint"></p>

      <div class="net-actions">
        <button id="btn-turn-save" class="btn btn-primary"><i class="fas fa-floppy-disk"></i> <span data-i18n="netcfg.save"></span></button>
        <button id="btn-turn-clear" class="btn ghost"><i class="fas fa-trash-can"></i> <span data-i18n="netcfg.clear"></span></button>
      </div>

      <button id="btn-net-test" class="btn btn-block"><i class="fas fa-stethoscope"></i> <span data-i18n="netcfg.test"></span></button>
      <ul class="net-report" id="net-report" hidden></ul>

      <p class="net-hint net-help" data-i18n="netcfg.help"></p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="script.js"></script>
</body>
</html>
